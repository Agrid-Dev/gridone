# Node addresses match fixtures/opcua-plc-nodes.json, mounted into the
# opcua-plc emulator (compose.override.yaml) as its custom node set.
# Namespace 3 verified by connecting to a live opcua-plc container — its
# custom-node namespace index is not documented and could shift on upgrade.
#
# server_service_level, boiler_eu_range_low and push_fast_uint read from
# opc-plc's built-in node set, not fixtures/opcua-plc-nodes.json (namespaces
# verified live). push_fast_uint is opc-plc's default "Fast" node
# (ns=3;s=FastUInt1), mutated server-side every ~1s with no flags needed.
id: opcua_plc
transport: opcua

update_strategy:
  polling: 2s
  # Far longer than any test timeout, so push_probe attributes can only
  # observe a change via something other than polling.
  polling_groups:
    push_probe: 1h

device_config: []

attributes:
  - name: acceptance_boolean
    data_type: bool
    read_write: "ns=3;s=AcceptanceBoolean"

  - name: acceptance_int32
    data_type: int
    read_write: "ns=3;s=AcceptanceInt32"
    codecs:
      - options: [1, 2]

  - name: acceptance_float
    data_type: float
    read_write: "ns=3;s=AcceptanceFloat"

  - name: acceptance_string
    data_type: str
    read_write: "ns=3;s=AcceptanceString"

  - name: server_service_level
    data_type: int
    read: "i=2267"

  - name: boiler_eu_range_low
    data_type: float
    read: "ns=6;s=DataAccess_AnalogType_DataAccess_AnalogType_Int32_EURange"
    codecs:
      - json_pointer: /Low

  - name: push_fast_uint
    data_type: int
    read: "ns=3;s=FastUInt1"
    polling_group: push_probe
    push: true
