<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1250" width="1040" height="1250">
<style>
svg{--synoptic-plate:216 24% 97%;--synoptic-grid:220 13% 88%;--synoptic-body:210 16% 93%;--synoptic-stroke:220 12% 40%;--foreground:222 25% 14%;--muted-foreground:220 9% 46%;--card:0 0% 100%;--border:220 13% 91%;--status-error:0 72% 51%;--status-ok:142 76% 36%;--hvac-fan:142 71% 45%;--water:206 88% 42%;--fluid-primary-supply:355 78% 48%;--fluid-primary-return:355 40% 36%;--fluid-heating-supply:22 92% 50%;--fluid-heating-return:22 50% 38%;--fluid-dhw:40 92% 46%;--fluid-dhw-loop:40 45% 36%;--fluid-cold-water:var(--water);--fluid-chilled-supply:190 85% 40%;--fluid-chilled-return:190 45% 30%;--fluid-condenser-supply:160 65% 36%;--fluid-condenser-return:160 35% 28%;font-family:Figtree,system-ui,sans-serif;font-feature-settings:"tnum"}
@media (prefers-color-scheme: dark){svg{--synoptic-plate:220 22% 11%;--synoptic-grid:220 12% 20%;--synoptic-body:218 14% 24%;--synoptic-stroke:220 10% 70%;--foreground:220 16% 87%;--muted-foreground:220 10% 58%;--card:230 22% 16%;--border:230 16% 23%;--status-error:0 75% 62%;--status-ok:142 65% 55%;--hvac-fan:142 65% 55%;--water:206 84% 60%;--fluid-primary-supply:355 80% 62%;--fluid-primary-return:355 45% 48%;--fluid-heating-supply:22 92% 62%;--fluid-heating-return:22 55% 50%;--fluid-dhw:40 90% 58%;--fluid-dhw-loop:40 50% 48%;--fluid-cold-water:var(--water);--fluid-chilled-supply:190 80% 56%;--fluid-chilled-return:190 45% 45%;--fluid-condenser-supply:160 60% 50%;--fluid-condenser-return:160 35% 42%;}}
.plate{fill:hsl(var(--synoptic-plate))}
.grid{stroke:hsl(var(--synoptic-grid));stroke-width:1;fill:none}
.body{stroke:hsl(var(--synoptic-stroke));stroke-width:1.5;stroke-linejoin:round}
.body{fill:hsl(var(--synoptic-body))}
.line{stroke:hsl(var(--synoptic-stroke));stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:hsl(var(--synoptic-stroke))}
.port{fill:hsl(var(--card));stroke:hsl(var(--synoptic-stroke));stroke-width:1.5}
.casing{stroke:hsl(var(--synoptic-plate));stroke-width:9;fill:none;stroke-linejoin:round;stroke-linecap:round}
.pipe{stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.leader{stroke:hsl(var(--muted-foreground));stroke-width:1;fill:none}
.chip,.chip-stale{fill:hsl(var(--card))}
.chip{stroke:hsl(var(--border));stroke-width:1}
.chip-stale{stroke:hsl(var(--muted-foreground));stroke-width:1;stroke-dasharray:3 2}
.t{fill:hsl(var(--foreground))}
.tm{fill:hsl(var(--muted-foreground))}
.title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.caption{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.note{font-size:11px;font-weight:400}
.tag{font-size:9px;font-weight:600;letter-spacing:.06em}
.val{font-size:12px;font-weight:600}
.unit{font-size:10px;font-weight:500}
.h{font-size:12px;font-weight:600}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style>
