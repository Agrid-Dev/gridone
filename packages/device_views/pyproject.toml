[project]
name = "gridone-device-views"
version = "0.1.0"
description = "Shared device display configurations"
requires-python = ">=3.13"
dependencies = ["gridone-models", "pydantic>=2.0", "asyncpg>=0.30.0", "yoyo-migrations>=8.2.0"]

[build-system]
requires = ["uv_build>=0.9.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "device_views"
module-root = "src"
