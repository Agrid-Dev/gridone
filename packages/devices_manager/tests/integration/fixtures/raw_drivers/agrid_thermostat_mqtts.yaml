    - EVENT_BOOT_NRST
    - EVENT_BOOT_POWER
    - EVENT_BOOT_SOFTWARE
    - EVENT_BOOT_WDT
    - EVENT_BOOT_WWDT
    - EVENT_BOOT_LOWPOWER
