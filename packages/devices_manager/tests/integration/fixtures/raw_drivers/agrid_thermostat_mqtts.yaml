id: agrid_thermostat_mqtts
vendor: Agrid
model: null
version: null
image_src: null
transport: mqtt
env: {}
update_strategy:
  polling_enabled: false
  polling_groups:
    full_refresh: 1h
  read_timeout: 10
healthcheck:
  expected_push_interval: 1h
device_config:
- name: mac
  required: true
discovery:
  topic: updData/+
  field_getters:
  - name: mac
    codecs:
    - json_path: $.mac
attributes:
- kind: standard
  name: firmware_version
  data_type: int
  polling_group: full_refresh
  read:
    topic: updData/${mac}
    request:
      topic: ${mac}
      message:
        data: ALL
        command: READ_DATA
    match:
      regex: '"name"\s*:\s*"FirmwareVersion"'
  write: null
  codecs:
  - name: json_path
    argument: $.data[?(@.name == "FirmwareVersion")].value
- kind: standard
  name: git_hash
  data_type: str
  read:
    topic: updData/${mac}
    request:
      topic: ${mac}
      message:
