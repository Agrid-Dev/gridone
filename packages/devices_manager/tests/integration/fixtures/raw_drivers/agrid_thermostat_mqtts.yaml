    request:
      topic: ${mac}
      message:
        data: Boot_Mode
        command: READ_DATA
    match:
      regex: '"name"\s*:\s*"Boot_Mode"'
  write: null
  codecs:
  - name: json_path
    argument: $.data[?(@.name == "Boot_Mode")].value
  - name: options
    argument:
    - BOOT_MODE_NORMAL
    - BOOT_MODE_FAKE_MINIMAL
    - BOOT_MODE_MINIMAL
