bindings:
  power:
    attribute: onoff_state
  mode:
    attribute: hvac_real_mode
  fan:
    attribute: fan_speed
  target:
    attribute: temperature_setpoint
  regulated:
    attribute: temperature_setpoint_effective
  measured:
    attribute: temperature
  humidity:
    attribute: humidity
  green_leaf:
    attribute: print_green_leaf
  print_temperature:
    attribute: print_indoor_temperature
  print_humidity:
    attribute: print_humidity
  precision:
    attribute: temperature_setpoint_precision
  unit:
    attribute: temperature_unit
  state_block:
    attribute: state_block
  setpoint_block:
    attribute: temperature_setpoint_block
  mode_block:
    attribute: hvac_mode_block
  fan_block:
    attribute: fan_speed_block
  firmware:
    attribute: app_version
  last_reboot:
    attribute: reboot_timestamp
  mode_setting:
    attribute: mode
controls:
  power:
    kind: toggle
    binding: power
    label:
      default: Power
      translations:
        fr: Marche / arrêt
  target:
    kind: number
    binding: target
    label:
      default: Setpoint
      translations:
        fr: Consigne
  fan:
    kind: select
    binding: fan
    label:
      default: Fan speed
      translations:
        fr: Ventilation
  mode:
    kind: select
    binding: mode_setting
    label:
      default: Mode
      translations:
        fr: Mode
page:
  kind: columns
  items:
  - weight: 3
    content:
      kind: stack
      children:
      - kind: section
        title:
          default: Setpoints and measurements
          translations:
            fr: Consignes et mesures
        description:
          default: What Gridone demands, what the device regulates, what the room measures
          translations:
            fr: Ce que Gridone demande, ce que l'appareil régule, ce que la chambre mesure
        children:
        - kind: setpoint-table
          rows:
          - label:
              default: Temperature
              translations:
                fr: Température
            demanded:
              control: target
            regulated:
              binding: regulated
            measured:
              binding: measured
            deviation:
              minuend: measured
              subtrahend: target
              tolerance: 0.5
            formatter:
              decimals: 1
        - kind: control-panel
          controls:
          - power
          - mode
          - fan
      - kind: section
        title:
          default: Reported by the room
          translations:
            fr: Ce qui remonte de la chambre
        children:
        - kind: measurements
          items:
          - binding: measured
            formatter:
              decimals: 1
          - binding: humidity
            formatter:
              decimals: 0
              unavailable:
                default: sensor not connected
                translations:
                  fr: capteur non branché
          - binding: firmware
          - binding: last_reboot
            formatter:
              relative_time: true
  - weight: 2
    content:
      kind: section
      title:
        default: Live
        translations:
          fr: En direct
      children:
      - kind: device-face
        label:
          default: Thermostat
          translations:
            fr: Thermostat
        view_box:
          width: 562
          height: 402
        layers:
        - kind: image
          asset: bezel
          box:
            x: 0
            y: 0
            width: 562
            height: 402
        - kind: rect
          box:
            x: 41
            y: 41
            width: 480
            height: 320
          fill: '#3a3a3a'
          radius: 8
          visible_when:
            op: eq
            binding: power
            value: true
        - kind: glyph-text
          glyph_set: main
          anchor:
            box:
              x: 194
              y: 139
              width: 185
              height: 95
            align: center
            dx: -54
            dy: 0
          text:
          - digit:
              binding: target
              place: tens
          color:
            rules:
            - when:
                op: eq
                binding: mode
                value: heat
              color: '#8caee7'
            - when:
                op: eq
                binding: mode
                value: cool
              color: '#d69263'
            - when:
                op: eq
                binding: mode
                value: auto
              color: '#84f3f7'
            default: '#ffffff'
          visible_when:
            op: all
            conditions:
            - op: eq
              binding: power
              value: true
            - op: not
              condition:
                op: eq
                binding: mode
                value: fan
        - kind: glyph-text
          glyph_set: main
          anchor:
            box:
              x: 194
              y: 139
              width: 185
              height: 95
            align: center
            dx: 11
            dy: 0
