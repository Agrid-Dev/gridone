# Presentation of the Agrid thermostat, the same document as the UI fixture
# apps/ui/src/components/device-ui/fixtures/agridThermostat/presentation.ts
# (face.ts transcribed layer for layer), plus the glyph sets of mainFont.json
# and montserrat16.json and the `mode` control the face's mode button targets
# (annex B §3.1: the control binds the standard `mode` attribute while the face
# shows the resolved real mode). Glyphs of the firmware font are private-use
# code points, written as \uXXXX escapes.
schema_version: 1
requires:
- layout/1
- controls/1
- measurements/1
- setpoint-table/1
- device-face/1
- glyph-text/1
- conditions/1
