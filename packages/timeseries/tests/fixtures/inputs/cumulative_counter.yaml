name: cumulative_counter
description: Energy index (kWh) read hourly over Feb 1-14 2025. Monotonically increasing
  apart from a meter replacement on 2025-02-11T09:00Z where the index restarts near
  zero (a negative delta), and a 3-day reading gap on Feb 5-7 (empty buckets, with
  the accrued consumption billed to the first bucket that reads again).
