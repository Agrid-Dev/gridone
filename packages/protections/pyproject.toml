[project]
name = "gridone-protections"
version = "0.1.0"
description = "Site-owned protections on device writes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["gridone-models", "asyncpg>=0.30.0", "pydantic>=2.0", "yoyo-migrations>=8.2.0"]

[build-system]
requires = ["uv_build>=0.9.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "protections"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "../models/src", "tests"]
markers = ["integration: mark a test as an integration test"]
